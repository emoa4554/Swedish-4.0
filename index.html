
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swedish Studio</title>

<style>
:root {
  --sage: #788875;
  --fjord: #88A6B5;
  --sand: #D9C7A5;
  --cream: #F7F5EF;
  --forest: #405747;
  --terracotta: #C28E79;
  --ink: #26352C;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--cream);
  min-height: 100vh;
}

.scenery {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: .28;
  pointer-events: none;
}

.scenery svg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.container {
  max-width: 1000px;
  padding: 24px;
  margin: auto;
}

header {
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin: 0;
  color: var(--forest);
  letter-spacing: -2px;
}

header p {
  color: #5C6F60;
  font-size: 1.05rem;
}

.card {
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(64,87,71,.12);
  border-radius: 22px;
  padding: 24px;
  margin: 18px 0;
  box-shadow: 0 8px 28px rgba(42,60,48,.06);
  backdrop-filter: blur(8px);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 1rem;
  transition: transform .15s, opacity .15s;
}

button:hover { transform: translateY(-1px); }
button:active { transform: scale(.97); }

.nav button {
  background: var(--forest);
  color: white;
}

#lessonTitle {
  text-align: center;
  flex: 1;
  color: var(--forest);
}

.progress-track {
  height: 10px;
  background: #E6E9E1;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 15px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--sage);
  transition: width .3s;
}

.section-title {
  color: var(--forest);
  margin-top: 0;
  font-size: 1.35rem;
}

.sentence {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #EAECE6;
  padding: 14px 0;
}

.sentence:last-child { border-bottom: 0; }

.sv {
  font-weight: 700;
  font-size: 1.08rem;
}

.en {
  color: #738076;
  font-size: .94rem;
  margin-top: 4px;
}

.sound-btn {
  background: #E7EEE6;
  color: var(--forest);
  flex-shrink: 0;
  padding: 10px 12px;
}

.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
}

.word-item {
  border: 1px solid #E3E8DF;
  background: #FAFBF8;
  padding: 16px;
  border-radius: 16px;
}

.word-name {
  font-size: 1.12rem;
  font-weight: 750;
  color: var(--forest);
}

.word-translation {
  color: #68776B;
  margin-top: 4px;
}

.word-type {
  color: #A07A66;
  font-size: .8rem;
  margin-top: 8px;
}

.learn-button {
  background: #E4EBE2;
  color: var(--forest);
  width: 100%;
  margin-top: 12px;
}

.learn-button.learned {
  background: var(--sage);
  color: white;
}

.expression {
  padding: 15px;
  border-left: 4px solid var(--terracotta);
  background: #FAF5F0;
  border-radius: 10px;
  margin: 12px 0;
}

.expression strong {
  display: block;
  color: var(--forest);
  margin-bottom: 5px;
}

.challenge {
  background: #EDF2E9;
  border-radius: 16px;
  padding: 20px;
}

.challenge button {
  background: var(--forest);
  color: white;
  margin-top: 10px;
}

#challengeAnswer {
  display: none;
  background: white;
  padding: 14px;
  border-radius: 12px;
  margin-top: 12px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.controls button {
  background: var(--forest);
  color: white;
}

.controls button.stop {
  background: var(--terracotta);
}

#status {
  color: #66766A;
  font-size: .9rem;
  min-height: 24px;
  margin-top: 10px;
}

footer {
  text-align: center;
  color: #7A887D;
  padding: 25px;
}

@media(max-width:600px) {
  .container { padding: 12px; }
  .card { padding: 18px; }
  .nav { flex-wrap: wrap; }
  #lessonTitle { order: -1; width: 100%; flex: 0 0 100%; }
  .sentence { align-items: flex-start; }
}
</style>
</head>

<body>

<div class="scenery" aria-hidden="true">
<svg viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
<rect width="1400" height="900" fill="#DDE6E5"/>
<circle cx="1080" cy="160" r="90" fill="#F3E7CB"/>
<path d="M0 390 L200 160 L370 360 L580 120 L820 390 L1040 190 L1400 420 L1400 900 L0 900Z" fill="#AABBC0"/>
<path d="M0 460 L180 300 L370 470 L640 250 L850 500 L1100 310 L1400 520 L1400 900 L0 900Z" fill="#88A6B5"/>
<path d="M0 550 Q200 470 420 560 T850 540 T1400 560 L1400 900 L0 900Z" fill="#A8C2C5"/>
<path d="M0 630 Q300 580 650 640 T1400 610 L1400 900 L0 900Z" fill="#C6D8D5"/>
<path d="M0 710 Q300 670 650 710 T1400 700 L1400 900 L0 900Z" fill="#D9C7A5"/>
<g fill="#405747">
<path d="M100 650 L40 470 L160 470Z"/><path d="M100 590 L20 390 L180 390Z"/><path d="M100 530 L45 320 L155 320Z"/>
<rect x="92" y="650" width="16" height="80"/>
<path d="M260 700 L200 510 L320 510Z"/><path d="M260 630 L180 420 L340 420Z"/><path d="M260 550 L210 340 L310 340Z"/>
<rect x="252" y="700" width="16" height="80"/>
<path d="M1190 660 L1120 460 L1260 460Z"/><path d="M1190 590 L1100 370 L1280 370Z"/><path d="M1190 510 L1140 290 L1240 290Z"/>
<rect x="1182" y="660" width="16" height="100"/>
<path d="M1320 690 L1260 510 L1380 510Z"/><path d="M1320 620 L1240 410 L1400 410Z"/><path d="M1320 550 L1270 330 L1370 330Z"/>
<rect x="1312" y="690" width="16" height="90"/>
</g>
<g fill="#C28E79">
<rect x="760" y="490" width="160" height="110"/>
<path d="M730 500 L840 400 L950 500Z" fill="#405747"/>
<rect x="820" y="540" width="40" height="60" fill="#F7F5EF"/>
<rect x="780" y="520" width="30" height="30" fill="#F7F5EF"/>
<rect x="870" y="520" width="30" height="30" fill="#F7F5EF"/>
</g>
</svg>
</div>

<div class="container">

<header>
<h1>Swedish Studio</h1>
<p>Small steps. Real Swedish. Every day.</p>
</header>

<div class="card">
<div class="nav">
<button id="prevBtn">← Previous</button>
<h2 id="lessonTitle">Day 1</h2>
<button id="nextBtn">Next →</button>
</div>
<div class="progress-track">
<div class="progress-fill" id="progressFill"></div>
</div>
<p id="progressText">0 / 5 words learned today</p>
</div>

<div class="card">
<h2 class="section-title">Listen & Learn</h2>
<div id="sentences"></div>
<div class="controls" style="margin-top:15px">
<button id="listenAll">▶ Listen to all</button>
<button id="stopBtn" class="stop">■ Stop</button>
</div>
<div id="status" aria-live="polite">Ready to listen.</div>
</div>

<div class="card">
<h2 class="section-title">Today's Vocabulary</h2>
<div class="word-grid" id="words"></div>
</div>

<div class="card">
<h2 class="section-title">Useful Expressions</h2>
<div id="expressions"></div>
</div>

<div class="card">
<h2 class="section-title">Grammar Note</h2>
<div id="grammar"></div>
</div>

<div class="card">
<h2 class="section-title">Daily Challenge</h2>
<div class="challenge">
<p id="challenge"></p>
<button id="showAnswer">Show answer</button>
<div id="challengeAnswer"></div>
</div>
</div>

<footer>Swedish Studio · Learn at your own pace</footer>

</div>

<script>
const lessons = [
{
title: "Day 1 · At home",
sentences: [
["Jag är hemma idag.", "I am home today."],
"Jag dricker kaffe på morgonen.",
"Det är ganska kallt ute.",
"Jag behöver lite mer tid.",
"Vi ses senare."
],
words: [
["hemma","at home","Adverb"],
["kaffe","coffee","Noun"],
["morgon","morning","Noun"],
["kallt","cold","Adjective"],
["senare","later","Adverb"]
],
expressions: [
["Det är lugnt.","It's okay / no worries."],
["Ingen fara.","No problem."],
["Vi ses!","See you!"]
],
grammar: "Swedish often places the verb in the second position in a main clause. Example: <b>Idag är jag hemma.</b> (Today I am home.)",
challenge: "Say in Swedish: 'I am home and I drink coffee.'",
answer: "Jag är hemma och jag dricker kaffe."
},
{
title: "Day 2 · Daily life",
sentences: [
"Jag vaknar ganska tidigt.",
"Jag äter frukost hemma.",
"Sedan går jag till jobbet.",
"Jag kommer hem vid fem.",
"På kvällen tittar jag på TV."
],
words: [
["vakna","to wake up","Verb"],
["frukost","breakfast","Noun"],
["sedan","then","Adverb"],
["jobba","to work","Verb"],
["kväll","evening","Noun"]
],
expressions: [
["Vad gör du idag?","What are you doing today?"],
["Jag är på väg.","I'm on my way."],
["Det låter bra.","That sounds good."]
],
grammar: "Swedish infinitive verbs often end in <b>-a</b>: <i>vakna, jobba, prata</i>. After modal verbs like <i>vill</i> and <i>kan</i>, use the infinitive.",
challenge: "Say: 'I wake up early and eat breakfast.'",
answer: "Jag vaknar tidigt och äter frukost."
},
{
title: "Day 3 · Going out",
sentences: [
"Jag ska gå till affären.",
"Behöver du någonting?",
"Jag köper lite mjölk.",
"Det finns många människor här.",
"Vi går hem tillsammans."
],
words: [
["affär","shop","Noun"],
["behöver","need","Verb"],
["någonting","something","Pronoun"],
["mjölk","milk","Noun"],
["tillsammans","together","Adverb"]
],
expressions: [
["Vad kostar det?","How much does it cost?"],
["Jag skulle vilja ha…","I would like…"],
["Kan jag få en påse?","Can I have a bag?"]
],
grammar: "Use <b>ska</b> + infinitive for plans or the future: <i>Jag ska handla.</i> (I am going to shop.)",
challenge: "Say: 'I am going to buy milk at the shop.'",
answer: "Jag ska köpa mjölk i affären."
},
{
title: "Day 4 · Feelings",
sentences: [
"Jag känner mig ganska glad.",
"Jag är lite trött idag.",
"Det var en lång dag.",
"Jag behöver vila en stund.",
"Nu känns det bättre."
],
words: [
["glad","happy","Adjective"],
["trött","tired","Adjective"],
["lång","long","Adjective"],
["vila","rest","Verb"],
["bättre","better","Adjective"]
],
expressions: [
["Hur mår du?","How are you?"],
["Så där.","So-so."],
["Jag mår bra.","I'm doing well."]
],
grammar: "Swedish adjective forms can change. For example: <i>en lång dag</i>, but <i>ett långt år</i>. The adjective often agrees with the noun.",
challenge: "Say: 'I am tired but happy.'",
answer: "Jag är trött men glad."
},
{
title: "Day 5 · Weather",
sentences: [
"Det regnar ute idag.",
"Jag tar med ett paraply.",
"Det blåser ganska mycket.",
"Vädret förändras snabbt.",
"Imorgon blir det sol."
],
words: [
["regnar","rains","Verb"],
["paraply","umbrella","Noun"],
["blåser","is windy","Verb"],
["väder","weather","Noun"],
["imorgon","tomorrow","Adverb"]
],
expressions: [
["Vilket väder!","What weather!"],
["Det är fint ute.","It's nice outside."],
["Hoppas på sol.","Hoping for sunshine."]
],
grammar: "For weather, Swedish commonly uses <b>det</b>: <i>Det regnar.</i>, <i>Det blåser.</i>, <i>Det är kallt.</i>",
challenge: "Say: 'It is raining today, but tomorrow it will be sunny.'",
answer: "Det regnar idag, men imorgon blir det sol."
},
{
title: "Day 6 · Conversation",
sentences: [
"Vad har du gjort idag?",
"Jag har varit hemma.",
"Jag har lagat mat.",
"Det var väldigt gott.",
"Vill du ha lite mer?"
],
words: [
["gjort","done","Verb"],
["varit","been","Verb"],
["lagat","cooked","Verb"],
["gott","tasty","Adjective"],
["mer","more","Adverb"]
],
expressions: [
["Absolut!","Absolutely!"],
["Gärna.","Gladly / Yes please."],
["Inte just nu.","Not right now."]
],
grammar: "The Swedish perfect tense uses <b>har + supine</b>: <i>Jag har lagat mat.</i> (I have cooked food.)",
challenge: "Say: 'I have cooked food and it was good.'",
answer: "Jag har lagat mat och det var gott."
},
{
title: "Day 7 · Weekend",
sentences: [
"På helgen tycker jag om att sova länge.",
"Vi kanske går ut och promenerar.",
"Jag vill träffa några vänner.",
"Det blir en lugn dag.",
"Jag ser fram emot helgen."
],
words: [
["helg","weekend","Noun"],
["promenera","to walk","Verb"],
["träffa","to meet","Verb"],
["lugnt","calm","Adjective"],
["ser fram emot","look forward to","Expression"]
],
expressions: [
["Vad har du för planer?","What are your plans?"],
["Vi får se.","We'll see."],
["Ha en trevlig helg!","Have a nice weekend!"]
],
grammar: "<b>Tycker om att + infinitive</b> means 'like doing something': <i>Jag tycker om att läsa.</i> The phrase <i>ser fram emot</i> means 'look forward to'.",
challenge: "Say: 'I look forward to the weekend.'",
answer: "Jag ser fram emot helgen."
}
];

let currentDay = 0;
let learnedToday = [];
let speechQueue = [];
let queueIndex = 0;
let selectedVoice = null;

const sentencesEl = document.getElementById("sentences");
const wordsEl = document.getElementById("words");
const expressionsEl = document.getElementById("expressions");
const grammarEl = document.getElementById("grammar");
const lessonTitleEl = document.getElementById("lessonTitle");
const progressFillEl = document.getElementById("progressFill");
const progressTextEl = document.getElementById("progressText");
const statusEl = document.getElementById("status");

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function soundButton(text, label = "") {
  return `<button type="button" class="sound-btn" data-speak="${escapeHTML(text)}">🔊 ${label}</button>`;
}

function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  selectedVoice =
    voices.find(v => v.lang.toLowerCase() === "sv-se") ||
    voices.find(v => v.lang.toLowerCase().startsWith("sv")) ||
    null;
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speakSwedish(text, button = null) {
  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "sv-SE";
  utter.rate = 0.85;
  utter.pitch = 1;

  loadVoices();
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onstart = () => {
    statusEl.textContent = "Speaking Swedish…";
    if (button) button.textContent = "🔊 Playing…";
  };

  utterance.onend = () => {
    statusEl.textContent = "Ready to listen.";
    if (button) button.textContent = "🔊 Listen";
  };

  utterance.onerror = () => {
    statusEl.textContent = "Audio error. Please tap the sound button again.";
    if (button) button.textContent = "🔊 Listen";
  };

  window.speechSynthesis.speak(utterance);
}

function speakNextInQueue() {
  if (queueIndex >= speechQueue.length) {
    statusEl.textContent = "Finished listening.";
    return;
  }

  const text = speechQueue[queueIndex++];
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "sv-SE";
  utterance.rate = 0.85;

  loadVoices();
  if (selectedVoice) utterance.voice = selectedVoice;

  utterance.onend = speakNextInQueue;
  utterance.onerror = speakNextInQueue;

  window.speechSynthesis.speak(utterance);
}

function speakAllSentences() {
  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();
  speechQueue = lessons[currentDay].sentences.map(s =>
    Array.isArray(s) ? s[0] : s
  );
  queueIndex = 0;
  statusEl.textContent = "Playing lesson…";
  speakNextInQueue();
}

function stopAudio() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  speechQueue = [];
  queueIndex = 0;
  statusEl.textContent = "Audio stopped.";
}

function renderLesson() {
  const lesson = lessons[currentDay];

  lessonTitleEl.textContent = lesson.title;

  sentencesEl.innerHTML = lesson.sentences.map(sentence => {
    const sv = Array.isArray(sentence) ? sentence[0] : sentence;
    const en = Array.isArray(sentence) ? sentence[1] : "";
    return `
      <div class="sentence">
        <div>
          <div class="sv">${escapeHTML(sv)}</div>
          ${en ? `<div class="en">${escapeHTML(en)}</div>` : ""}
        </div>
        ${soundButton(sv, "Listen")}
      </div>
    `;
  }).join("");

  wordsEl.innerHTML = lesson.words.map((word, i) => {
    const isLearned = learnedToday.includes(i);
    return `
      <div class="word-item">
        <div class="word-name">
          ${escapeHTML(word[0])}
          ${soundButton(word[0])}
        </div>
        <div class="word-translation">${escapeHTML(word[1])}</div>
        <div class="word-type">${escapeHTML(word[2])}</div>
        <button type="button" class="learn-button ${isLearned ? "learned" : ""}" data-learn="${i}">
          ${isLearned ? "✓ Learned" : "Mark as learned"}
        </button>
      </div>
    `;
  }).join("");

  expressionsEl.innerHTML = lesson.expressions.map(expression => `
    <div class="expression">
      <strong>${escapeHTML(expression[0])} ${soundButton(expression[0])}</strong>
      ${escapeHTML(expression[1])}
    </div>
  `).join("");

  grammarEl.innerHTML = lesson.grammar;
  document.getElementById("challenge").textContent = lesson.challenge;
  document.getElementById("challengeAnswer").textContent = lesson.answer;
  document.getElementById("challengeAnswer").style.display = "none";
  document.getElementById("showAnswer").textContent = "Show answer";

  updateProgress();
}

function updateProgress() {
  const count = learnedToday.length;
  progressFillEl.style.width = `${count / 5 * 100}%`;
  progressTextEl.textContent = `${count} / 5 words learned today`;
}

document.addEventListener("click", event => {
  const soundBtn = event.target.closest("[data-speak]");
  if (soundBtn) {
    const phrase = soundBtn.getAttribute("data-speak");
    speakSwedish(phrase, soundBtn);
    return;
  }

  const learnBtn = event.target.closest("[data-learn]");
  if (learnBtn) {
    const index = Number(learnBtn.getAttribute("data-learn"));

    if (learnedToday.includes(index)) {
      learnedToday = learnedToday.filter(i => i !== index);
    } else {
      learnedToday.push(index);
    }

    renderLesson();
  }
});

document.getElementById("prevBtn").addEventListener("click", () => {
  stopAudio();
  currentDay = (currentDay - 1 + lessons.length) % lessons.length;
  learnedToday = [];
  renderLesson();
});

document.getElementById("nextBtn").addEventListener("click", () => {
  stopAudio();
  currentDay = (currentDay + 1) % lessons.length;
  learnedToday = [];
  renderLesson();
});

document.getElementById("listenAll").addEventListener("click", speakAllSentences);
document.getElementById("stopBtn").addEventListener("click", stopAudio);

document.getElementById("showAnswer").addEventListener("click", () => {
  const answer = document.getElementById("challengeAnswer");
  const button = document.getElementById("showAnswer");

  if (answer.style.display === "none") {
    answer.style.display = "block";
    button.textContent = "Hide answer";
  } else {
    answer.style.display = "none";
    button.textContent = "Show answer";
  }
});

renderLesson();
</script>

</body>
</html>
